name: Issue in a Vs. Winmario fork
description: If you experience an issue in your Vs. WinMario that could be caused by the mainline code, you can try reporting it here 
labels: [external]
body:
  - type: textarea
    attributes:
      label: What is your issue?
    validations:
      required: true
  - type: textarea
    id: terminal
    attributes:
      label: "Command Prompt/Terminal logs (required)"
      render: bash
    validations:
      required: true

  - type: input
    id: pslice-version
    attributes:
      label: "Which \"P-Slice\" version of WinMario this occurs in"
      placeholder: "3.2.1"
    validations:
      required: true

  - type: input
    id: psych
    attributes:
      label: "Which \"Psych Engine\" version of WinMario this occurs in"
      options:
        placeholder: "3.2.1"
    validations:
      required: true

  - type: dropdown
    id: btarget
    attributes:
      label: "What is your build target?"
      options:
        - "Windows"
        - "Linux"
        - "Mac"
    validations:
      required: true

  - type: input
    id: buildsummary
    attributes:
      label: "What changes have you made in your fork?"
      placeholder: "I edited ClientPrefs.hx and tried to add a new setting"
    validations:
      required: true